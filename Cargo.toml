[package]
name = "wander"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.91"
cpal = "0.18.1"
crossterm = { version = "0.29.0", features = ["event-stream"] }
directories = "6.0.0"
discord-rich-presence = "1.1.0"
futures-util = "0.3.33"
image = "0.25.10"
keyring = "4.1.5"
lofty = "0.24.0"
md-5 = "0.11.0"
mpris-server = "0.10.0"
opus = "0.3.1"
rand = "0.10.2"
ratatui = "0.30.2"
ratatui-image = { version = "11.0.6", default-features = false, features = ["image-defaults", "crossterm"] }
reqwest = { version = "0.13.4", default-features = false, features = ["rustls", "json", "stream", "http2", "charset"] }
rtrb = "0.3.4"
rustfft = "6.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
symphonia = { version = "0.6.0", features = ["all"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
toml = "1.1.3"
urlencoding = "2.1.3"
walkdir = "2.5.0"

[features]
default = []
nyaa = []

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
