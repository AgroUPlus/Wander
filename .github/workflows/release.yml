name: Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release against (defaults to current ref)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: wander-x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact_name: wander-aarch64-unknown-linux-gnu

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libopus-dev libdbus-1-dev pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release archive
        id: package
        shell: bash
        run: |
          TAG_NAME="${{ github.event.release.tag_name || github.ref_name }}"
          PKG_NAME="wander-${TAG_NAME}-${{ matrix.target }}"
          PKG_DIR="dist/${PKG_NAME}"
          mkdir -p "${PKG_DIR}" "${PKG_DIR}/packaging"

          cp "target/${{ matrix.target }}/release/wander" "${PKG_DIR}/"
          cp README.md LICENSE install.sh "${PKG_DIR}/"
          cp packaging/wander.desktop packaging/wander.svg "${PKG_DIR}/packaging/"

          tar -czf "dist/${PKG_NAME}.tar.gz" -C dist "${PKG_NAME}"
          cd dist
          sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
