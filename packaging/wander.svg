<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16161e"/>
      <stop offset="100%" stop-color="#24283b"/>
    </linearGradient>

    <!-- Soundwave W & Star Gradient -->
    <linearGradient id="waveGrad" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7dcfff"/>
      <stop offset="50%" stop-color="#bb9af7"/>
      <stop offset="100%" stop-color="#ff79c6"/>
    </linearGradient>

    <!-- Star Radial Glow -->
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff79c6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ff79c6" stop-opacity="0"/>
    </radialGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bg)" stroke="#2f3549" stroke-width="1.5"/>

  <g filter="url(#glow)">
    <!-- W-Shaped Audio Soundwave Line -->
    <path d="M 30 60 C 32 76, 38 88, 45 88 C 52 88, 56 46, 64 46 C 72 46, 76 86, 83 86 C 89 86, 92 65, 96 42"
          fill="none"
          stroke="url(#waveGrad)"
          stroke-width="7"
          stroke-linecap="round"
          stroke-linejoin="round"/>

    <!-- Small Glowing North Star placed directly ON the line endpoint (96, 42) -->
    <circle cx="96" cy="42" r="10" fill="url(#starGlow)" />
    <g transform="translate(96, 42)">
      <!-- 4-point star on the line tip -->
      <path d="M 0 -8 L 2.2 -2.2 L 8 0 L 2.2 2.2 L 0 8 L -2.2 2.2 L -8 0 L -2.2 -2.2 Z" fill="#ffffff"/>
      <path d="M 0 -6 L 1.5 -1.5 L 6 0 L 1.5 1.5 L 0 6 L -1.5 1.5 L -6 0 L -1.5 -1.5 Z" fill="#ff79c6"/>
    </g>
  </g>
</svg>


